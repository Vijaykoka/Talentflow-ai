# Render Blueprint
# Deploy this service automatically when pushing to main

services:
  - type: web
    name: talentflow-ai
    env: node
    region: oregon
    plan: free
    rootDir: ./
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: talentflow-ai
          envVarKey: RENDER_EXTERNAL_URL
        transform: "https://{{ .Value | trimPrefix \"https://\" }}"
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: talentflow-ai
          envVarKey: RENDER_EXTERNAL_URL

# Uncomment below for auto-scaling on Render paid plans
# autoScaling:
#   minInstances: 1
#   maxInstances: 3
#   targetCPUPercent: 75

