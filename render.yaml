# Render Blueprint - Simplified for Free Tier
services:
  - type: web
    name: talentflow-ai
    env: node
    region: oregon
    plan: free
    rootDir: ./
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false